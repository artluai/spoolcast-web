# Cloudflare Pages config for spoolcast-web.
# The SPA (editor + viewer site) builds to dist/; functions/ become Pages
# Functions. The viewer-site API reads D1; published video files live in the
# spoolcast-videos R2 bucket and are served from its public URL.
name = "spoolcast-web"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[vars]
# Sign-ins from these addresses get the admin role (comma-separated) — keeps
# the operator account admin even on a fresh database.
ADMIN_EMAILS = "bitbrandsagency@gmail.com"
# Browser engine requests stay same-origin. Pages adds the private Railway
# bearer secret before forwarding them to this hosted API.
ENGINE_API_URL = "https://spoolcast-production.up.railway.app"

[[d1_databases]]
binding = "DB"
database_name = "spoolcast-site"
database_id = "ad151aba-415c-4988-bc6d-67673432d39d"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "spoolcast-videos"

# Global asset library (character sheets, templates) — written by the admin
# publish endpoints, served to browsers from the bucket's public URL.
# ("ASSETS" itself is a reserved binding name in Pages projects.)
[[r2_buckets]]
binding = "GLOBAL_ASSETS"
bucket_name = "spoolcast-assets"
